[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-store-ai"
version = "1.0.0"
description = "MCP server that lets AI assistants (Claude, any MCP client) read and safely update MM Store"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
mm-store-ai = "mmstore_ai.server:main"

[tool.setuptools]
packages = ["mmstore_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
