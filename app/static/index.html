<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MM Store</title>
  <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23ecdcb4%22/%3E%3Cstop offset=%22.4%22 stop-color=%22%23b8914f%22/%3E%3Cstop offset=%22.65%22 stop-color=%22%23f3e6c6%22/%3E%3Cstop offset=%221%22 stop-color=%22%23a17839%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2231%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2232%22 y=%2240%22 font-family=%22Georgia,serif%22 font-size=%2222%22 fill=%22white%22 text-anchor=%22middle%22%3EMM%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- Connexion -->
  <main id="login-screen" class="login" hidden>
    <div class="login-phone" aria-hidden="true"><div class="screen"><div class="brand"><span class="brand-mark">MM</span><span class="brand-name store-name">MM Store</span></div></div></div>
    <form id="login-form" class="login-card">
      <div class="brand brand-lg"><span class="brand-mark">MM</span><span class="brand-name store-name">MM Store</span></div>
      <h1>Bienvenue</h1>
      <p class="muted">Connectez-vous pour ouvrir la caisse.</p>
      <label>Email <input name="username" type="email" autocomplete="username" required></label>
      <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-xl" type="submit">Se connecter</button>
    </form>
  </main>

  <!-- Application -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">MM</span><span class="brand-name store-name">MM Store</span></div>
      <nav id="nav" aria-label="Menu principal"></nav>
      <div class="me">
        <div class="me-name" id="user-name"></div>
        <div class="me-role muted" id="user-role"></div>
        <button class="link" id="password-btn" type="button">Mon mot de passe</button>
        <button class="link" id="logout-btn" type="button">Se déconnecter</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Fenêtre réutilisée pour tous les formulaires -->
  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <header class="modal-head"><h2 id="modal-title"></h2><button type="button" class="icon-btn" id="modal-close" aria-label="Fermer"></button></header>
      <div id="modal-body" class="modal-body"></div>
      <p class="error" id="modal-error" role="alert"></p>
      <footer class="modal-foot" id="modal-foot"></footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
