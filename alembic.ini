[alembic]
script_location = migrations
# Lets migrations/env.py import the `app` package when the `alembic` command runs from the project folder.
prepend_sys_path = .
# The database URL comes from DATABASE_URL (see migrations/env.py), not from this file,
# so no password is ever written in a file you commit.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
