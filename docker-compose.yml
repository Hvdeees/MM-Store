# Start everything:   docker compose up --build
# Then (once):        docker compose exec api python -m app.cli create-admin --email ... --name "..."
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
      POSTGRES_DB: boutique
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique"]
      interval: 2s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://boutique:${POSTGRES_PASSWORD}@db:5432/boutique
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY dans le fichier .env}
      ENVIRONMENT: production
      STORE_NAME: ${STORE_NAME:-MM Store}
      MEDIA_DIR: /code/media
      STORE_TIMEZONE: Africa/Casablanca
    volumes:
      - media:/code/media                 # product photos survive container restarts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
